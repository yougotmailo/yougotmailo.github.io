<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yougotmailo</title>
  <link rel="icon" type="image/png" href="pics/logo.png">
  <meta property="og:type" content="website">
<meta property="og:title" content="yougotmailo — sites &amp; archives">
<meta
  property="og:description"
  content="my collection of websites, archives, and tools. explore my projects or suggest something to add or archive."
>
  <meta property="og:url" content="https://tctrackeruploader.github.io/">
<meta property="og:image" content="https://tctrackeruploader.github.io/pics/logo.png">
<meta property="og:image:alt" content="yougotmailo logo">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, Helvetica, sans-serif;
      color: white;

      /* Background behind the blue middle panel */
      background-color: #151515;
      background-image: url("pics/bg.png");
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 25px;

      /* Change this color to change the blue middle */
      background-color: #2159b5;
      border: 1px solid #112f64;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: normal;
      text-align: center;
    }

    .intro {
      margin: 0 0 25px;
      text-align: center;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .site {
      display: block;
      color: white;
      text-align: center;
      text-decoration: none;
    }

    .site img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background-color: #163d7d;
      border: 1px solid #102c5d;
    }

    .site span {
      display: block;
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .site:hover span {
      text-decoration: underline;
    }

    .site-logo {
  display: block;
  width: 96px;
  height: 96px;
  margin: 0 auto 12px;
  object-fit: contain;
}
    
    .site:focus-visible {
      outline: 3px solid white;
      outline-offset: 5px;
    }

    .suggestion-box {
  margin: 0 0 25px;
  padding: 16px;
  text-align: center;
  background-color: #19478f;
  border: 1px solid #112f64;
}

.suggestion-box p {
  margin: 0 0 12px;
  font-size: 14px;
  line-height: 1.5;
}

.suggestion-button {
  display: inline-block;
  padding: 10px 18px;
  background-color: white;
  color: #163d7d;
  border: 1px solid #102c5d;
  font-size: 14px;
  font-weight: bold;
  text-decoration: none;
}

.suggestion-button:hover {
  background-color: #e2ebff;
  text-decoration: underline;
}

.suggestion-button:focus-visible {
  outline: 3px solid white;
  outline-offset: 4px;
}
    footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      main {
        padding: 18px;
      }
    }

    @media (max-width: 360px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <img class="site-logo" src="pics/logo.png" alt="yougotmailo logo">
    <h1>yougotmailo</h1>
<p class="intro">my sites / archives</p>

<section class="suggestion-box" aria-label="Suggestions">
  <p>have something you want me to add or archive?</p>

  <a
    class="suggestion-button"
    href="https://docs.google.com/forms/d/e/1FAIpQLSdJ7rihAFmQRKt_gBw74PipNmcPWURyDy8GS5Dn5Vr2KSEl-A/viewform?usp=header"
    target="_blank"
    rel="noopener noreferrer"
  >
    send a suggestion ↑
  </a>
</section>

    <div class="grid">
      <a class="site"
         href="https://tctrackeruploader.github.io/rocky-and-tyler-tour/">
        <img src="pics/rocky-and-tyler.png"
             alt="Rocky and Tyler Tour">
        <span>Rocky and Tyler Tour</span>
      </a>

      <a class="site"
         href="https://tctrackeruploader.github.io/imeemtyler2008/">
        <img src="pics/imeem.png"
             alt="Tyler, The Creator's imeem">
        <span>Tyler, The Creator imeem Archive</span>
      </a>

      <a class="site"
         href="https://tctrackeruploader.github.io/freeperm/">
        <img src="pics/freeperm.png"
             alt="Freeperm Archive">
        <span>Freeperm Archive</span>
      </a>

      <a class="site"
         href="https://tctrackeruploader.github.io/oddfuture_music/">
        <img src="pics/oddfuture.png"
             alt="Odd Future Music">
        <span>Odd Future Music</span>
      </a>
      
      <a class="site"
         href="https://tctrackeruploader.github.io/geometrydashccdat/">
        <img src="pics/geometrydash.png"
             alt="Geometry Dash Save File Editor">
        <span>geometry dash Save File Editor</span>
      </a>

      <a class="site"
         href="https://tctrackeruploader.github.io/cod4-tracker/">
        <img src="pics/cod4.png"
             alt="Call of Duty 4 Tracker">
        <span>Call of Duty 4 Mission Tracker</span>
      </a>

      <a class="site"
         href="https://tctrackeruploader.github.io/formspringarchive/">
        <img src="pics/formspring.png"
             alt="Formspring Archive">
        <span>Formspring Archive</span>
      </a>
    </div>

    <footer>yougotmailo</footer>
  </main>
</body>
</html>
